plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/acceleratedrendering.accesswidener")
}

// ⚠️ 已知性能陷阱：LWJGL 3.4.1 在 JDK 25 上会自动启用 FFM 后端
// （jar 内 `META-INF/versions/25/` 覆盖根目录实现），其 memPutXxx 内部为
// `VarHandle.set` + `MemorySegment.reinterpret` + `Reflection.getCallerClass`。
// JIT 完成内联前每次调用要付反射级开销（实测 Render thread CPU 占用 91%，
// fps 从 150+ 掉到 5-6 且长期不收敛；是否发作取决于 JIT 编译时机 → 表现为「随机」）。
// 本 mod 的 `beginTransform` 每帧调用近 4 万次矩阵写入，是典型受害者。
//
// 官方规避方案（doc/FFM.md）：用 `org.lwjgl:lwjgl:<version>:unsafe` classifier
// 退回 JNI/Unsafe 后端。**但注意**：在 Gradle 层做依赖替换对 Loom 无效
// （`minecraftClientRuntimeLibraries` 是独立配置，`configurations.configureEach`
// 的 resolutionStrategy 不生效，已于 2026-09-14 实测确认）。
// 本机开发请直接替换 Gradle 缓存中的 jar：
//   ~/.gradle/caches/modules-2/files-2.1/org.lwjgl/lwjgl/3.4.1/<hash>/lwjgl-3.4.1.jar
//   （备份原文件后，用 lwjgl-3.4.1-unsafe.jar 覆盖）

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		url = "https://raw.github.com/Sh1roCu/Sh1roCu_MCRepo/master/repository"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	// 26.1 的 Minecraft 官方取消了反混淆，下载的 jar 未经混淆（官方命名）
	// 因此不需要 mappings 块，且 mod 依赖无需 remap，使用标准 Gradle 配置替代 loom 的 mod* 配置
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5")
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "maven.modrinth:sodium:mc26.1-0.8.7-fabric"
	compileOnly "maven.modrinth:iris:1.11.3+26.1-fabric"
	compileOnly "maven.modrinth:modern-ui:3.13.0.5"
	compileOnly "maven.modrinth:geckolib:5.5"
	compileOnly "maven.modrinth:entity-model-features:3.3.5-fabric-26.1"
	compileOnly "maven.modrinth:immediatelyfast:1.15.3+26.1-fabric"
	compileOnly "maven.modrinth:axiom:6.0.5"
	compileOnly "maven.modrinth:malilib:0.28.12"
	compileOnly "maven.modrinth:tweakermore:v3.33.2-mc26.1.2"
	compileOnly "maven.modrinth:tweakeroo:0.28.10"
	compileOnly "maven.modrinth:rei:26.1.819+fabric"
	compileOnly "maven.modrinth:trinkets-canary:3.10.0-1.21.4"
	compileOnly "maven.modrinth:touhoulittlemaid-orihime:0.8.2-neo1.5.3+mc1.21.1"
	compileOnly "curse.maven:ftb-library-fabric-438495:8574543"


	compileOnly("com.moulberry:mixinconstraints:1.1.0")
	compileOnly("org.projectlombok:lombok:1.18.46")
	annotationProcessor("org.projectlombok:lombok:1.18.46")

	include implementation("net.neoforged:bus:8.0.5")
}

processResources {
	var replaceProperties = [
			minecraft_version: minecraft_version,
			mod_id           : mod_id,
			mod_name         : mod_name,
			mod_license      : mod_license,
			mod_version      : mod_version,
			mod_authors      : mod_authors,
			mod_description  : mod_description
	]
	inputs.properties replaceProperties

	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// RenderDoc 抓帧：直接用 Loom 内置的 `runClientRenderDoc`，无需自定义任务。
//
// Loom 1.17 自带完整集成（`downloadRenderDoc` / `extractRenderDoc` / `runClientRenderDoc`
// / `startRenderDocUI`），它会自行下载并解压官方的 renderdoccmd，然后以
//   renderdoccmd capture --wait-for-exit --working-dir <runDir> //     <javaLauncher> <allJvmArgs> -Dfabric.loom.renderdoc.enabled=true <mainClass>
// 的方式拉起游戏 JVM —— RenderDoc 是游戏进程的直接父进程。
//
// ⚠️ 不要改写成 `renderdoccmd capture ... gradlew runClient`：Gradle daemon 是常驻进程，
// wrapper 只是把任务转发给它，真正 fork 出游戏 JVM 的是 daemon，结果被 hook 的
// java.exe 里跑的是 Gradle 逻辑而非游戏，抓不到正确的帧。
//
// 用法：`./gradlew runClientRenderDoc` → 进世界站到目标前 → 按 F12 抓帧。
// 另有 `./gradlew startRenderDocUI` 可单独打开 RenderDoc 界面。

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// 26.1 移植分阶段策略：先从编译中排除非实体加速源码（文件保留在磁盘，后续阶段逐步加回）。
// 只保留实体加速核心：core、configs、features/culling、features/modelparts、features/entities（除 InventoryScreenMixin）、compat/vanilla。
sourceSets {
	main {
		java {
			// 物品加速：已加回核心（BakedQuad 加速、网格缓存、动态面缓存）。
			// 未加回的部分：
			//  - GUI 相关（gui/**、mixins/gui/**）—— 本次范围外
			//  - 依赖 26.1 已移除 API 的旧文件（BakedModel 体系、ItemRenderer、ModelBlockRenderer）
			exclude 'com/namelessgod2008/features/items/gui/**'
			exclude 'com/namelessgod2008/features/items/mixins/gui/**'
			exclude 'com/namelessgod2008/features/items/BakedModelExtension.java'
			exclude 'com/namelessgod2008/features/items/mixins/ItemRendererMixin.java'
			exclude 'com/namelessgod2008/features/items/mixins/ModelBlockRendererMixin.java'
			exclude 'com/namelessgod2008/features/items/mixins/models/**'
			exclude 'com/namelessgod2008/features/items/mixins/accessors/**'
			// 依赖 26.1 已移除的 BlockColor（改为 BlockTintSource）；本加速路径用
			// TintLayerColors（来自 ItemSubmit.tintLayers），不需方块着色体系
			exclude 'com/namelessgod2008/features/items/colors/BlockLayerColors.java'
			exclude 'com/namelessgod2008/features/items/colors/ColorHelper.java'
			exclude 'com/namelessgod2008/features/items/colors/EmptyBlockColor.java'
			exclude 'com/namelessgod2008/features/items/colors/ItemLayerColors.java'
			// 依赖已移除的 BakedModel 体系
			exclude 'com/namelessgod2008/features/items/IAcceleratedBakedModel.java'
			exclude 'com/namelessgod2008/features/filter/mixins/**'
			exclude 'com/namelessgod2008/features/filter/FilterFeature.java'
			exclude 'com/namelessgod2008/features/filter/FilterIMC.java'
			exclude 'com/namelessgod2008/features/filter/ItemStackFilterStack.java'
			// FilterType 是纯枚举，FeatureConfig 依赖它，保留
			exclude 'com/namelessgod2008/features/geckolib/**'
			exclude 'com/namelessgod2008/features/ftb/**'
			exclude 'com/namelessgod2008/features/modernui/**'
			exclude 'com/namelessgod2008/features/text/**'
			exclude 'com/namelessgod2008/features/tlm/**'
			exclude 'com/namelessgod2008/features/create/**'
			exclude 'com/namelessgod2008/features/emf/**'
			exclude 'com/namelessgod2008/features/simplebedrockmodel/**'
			exclude 'com/namelessgod2008/features/entities/mixins/InventoryScreenMixin.java'
			// 未注册的孤儿 mixin（依赖 items/text）
			exclude 'com/namelessgod2008/core/mixins/compatibility/ParticleEngineMixin.java'
			// 26.1 / Iris 1.11.4：已修复适配（Iris 移除了 batchedentityrendering 包，
			// 相关 mixin 已按新架构重写；见 compat/iris 的类注释），故不再排除。
			exclude 'com/namelessgod2008/compat/immediatelyfast/**'
			exclude 'com/namelessgod2008/compat/tweakeroo/**'
			exclude 'com/namelessgod2008/compat/xaero/**'
			exclude 'com/namelessgod2008/compat/rei/**'
			exclude 'com/namelessgod2008/compat/tweakmore/**'
			exclude 'com/namelessgod2008/compat/trinkets/**'
			exclude 'com/namelessgod2008/compat/sophisticated/**'
			exclude 'com/namelessgod2008/compat/forgeconfigapiport/**'
			// 26.1 移除 BakedQuad/GuiGraphics 等，这些 Forge 物品/配置辅助类无法编译。
			// 配置界面改用 forgeconfigapiport 26.1.5 自带的 ConfigurationScreen（见 ARModMenu）。
			exclude 'net/neoforged/neoforge/client/gui/ConfigScreen.java'
			exclude 'net/neoforged/neoforge/client/model/IQuadTransformer.java'
			// 无引用的孤儿辅助类（26.1 TextureAtlasSprite/SpriteContents 构造器变化）
			exclude 'net/neoforged/neoforge/client/textures/UnitTextureAtlasSprite.java'
		}
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

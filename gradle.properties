# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Network resilience — retry on chunked transfer failures
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.keepAlive=false
systemProp.maven.wagon.rto=30000
systemProp.maven.wagon.http.retryHandler.count=5

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.4
neogradle.subsystems.parchment.mappingsVersion=2025.03.23

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.4
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=acceleratedrendering
# The human-readable display name for the mod.
mod_name=Accelerated Rendering
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.0.14-1.21.4
maven_group=com.namelessgod2008

# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Argon4W

# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Fast vertex transform and caching using compute shader.

# Dependencies
fabric_api_version=0.119.4+1.21.4
modmenu_version=13.0.4

imguiVersion=1.90.0